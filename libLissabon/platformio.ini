; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
;
; common options for all variants of iotsa
;
[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = 
    https://github.com/cwi-dis/iotsa.git#develop
    h2zero/NimBLE-Arduino
monitor_speed = 115200

;
; This file has no [env:*] sections -- libLissabon is built as a source library
; by the appliances, never on its own. Per-processor board definitions live in
; the toplevel ../iotsa-board-defs.ini / ../iotsa-board-traits.ini, vendored from
; cwi-dis/iotsa (see cwi-dis/iotsa#224); each appliance's platformio.ini pulls
; them in via extra_configs.
;

[use_debugger]
debug_tool = minimodule
upload_protocol = minimodule

