; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs =
#	lissabon-220-switch
#	lissabon-candle
	lissabon-plugin-dimmer
#	lissabon-1button-dimmer
#	lissabon-double-dimmer
#	lissabon-buttons-dimmer
#	lissabon-hidden-dimmer
#	lissabon-touchpad-dimmer
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of ../iotsa-board-defs.ini. Refresh the two toplevel iotsa-board-*.ini
; files whenever the iotsa dependency is bumped; do not hand-edit. App-specific
; choices stay in the [env:*] sections.
extra_configs =
    ../iotsa-board-traits.ini
    ../iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
	https://github.com/cwi-dis/iotsa.git#develop
	libLissabon
    h2zero/NimBLE-Arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Full PWM dimmer on esp32dev: brightness level, gamma, animation, adjustable
; PWM frequency. min_spiffs -- the BLE stack needs the app space.
[dimmer_esp32dev]
extends = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = -DIOTSA_WITH_BLE -DDIMMER_WITH_GAMMA -DDIMMER_WITH_ANIMATION -DDIMMER_WITH_PWMFREQUENCY -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

[env:lissabon-touchpad-dimmer]
extends = dimmer_esp32dev
build_flags = ${dimmer_esp32dev.build_flags} -DVARIANT=\"defs_touchpads.h\"

[env:lissabon-buttons-dimmer]
extends = dimmer_esp32dev
build_flags = ${dimmer_esp32dev.build_flags} -DVARIANT=\"defs_buttons.h\"

[env:lissabon-1button-dimmer]
extends = dimmer_esp32dev
build_flags = ${dimmer_esp32dev.build_flags} -DVARIANT=\"defs_1button.h\"

[env:lissabon-double-dimmer]
extends = dimmer_esp32dev
build_flags = ${dimmer_esp32dev.build_flags} -DVARIANT=\"defs_double.h\"

[env:lissabon-plugin-dimmer]
extends = dimmer_esp32dev
build_flags = ${dimmer_esp32dev.build_flags} -DVARIANT=\"defs_rotary.h\"

[env:lissabon-hidden-dimmer]
extends = dimmer_esp32dev
build_flags = ${dimmer_esp32dev.build_flags} -DVARIANT=\"defs_hidden.h\"

; Switch variants: on/off only, no brightness level.

; candle -- lolin32-lite (the [lolin32] board-def already sets board=lolin32_lite
; and min_spiffs partitions).
[env:lissabon-candle]
extends = lolin32
build_flags = -DIOTSA_WITH_BLE -DDIMMER_WITHOUT_LEVEL -DVARIANT=\"defs_candle.h\" -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

; 220-switch -- hacked 220V switch on an esp32-c3 SuperMini. The
; _esp32c3_nativeusb trait supplies the USB-CDC-as-Serial flags; the
; [esp32c3supermini] board-def supplies board/mcu/min_spiffs/4MB-flash.
[env:lissabon-220-switch]
extends = esp32c3supermini
build_flags = ${_esp32c3_nativeusb.build_flags} -DIOTSA_WITH_BLE -DDIMMER_WITHOUT_LEVEL -DVARIANT=\"defs_220switch.h\" -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
