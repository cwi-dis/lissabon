; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs = lissabon-simple-light
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of ../iotsa-board-defs.ini. Refresh the two toplevel iotsa-board-*.ini
; files whenever the iotsa dependency is bumped; do not hand-edit. App-specific
; choices stay in the [env:*] sections.
extra_configs =
    ../iotsa-board-traits.ini
    ../iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    https://github.com/cwi-dis/iotsa.git#develop
    libLissabon
    h2zero/NimBLE-Arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

;
; esp32dev: has a PRG/BOOT button (GPIO0, reused as the on/off pushbutton)
; and an onboard LED (GPIO2, the light itself).
;
[env:lissabon-simple-light]
extends = esp32dev
board_build.partitions = min_spiffs.csv ; BLE stack takes up a lot of space
build_flags = -DIOTSA_WITH_BLE -DDIMMER_WITHOUT_LEVEL -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
