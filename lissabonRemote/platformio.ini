; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs = lissabon-kitchen-remote
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of ../iotsa-board-defs.ini. Refresh the two toplevel iotsa-board-*.ini
; files whenever the iotsa dependency is bumped; do not hand-edit. App-specific
; choices stay in the [env:*] sections.
extra_configs =
    ../iotsa-board-traits.ini
    ../iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    https://github.com/cwi-dis/iotsa.git#develop
    libLissabon
    h2zero/NimBLE-Arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DIOTSA_WITH_BLE -DIOTSA_WITH_LEGACY_SPIFFS -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

;
; The LiPo-powered 2-channel remote control unit. Uses a lolin32-lite because
; it has a LiPo charger. No longer made, but clones are, and are cheap and
; small. Can be used with minimodule debugging (but not while using the
; touchpads). no_ota partitions -- the BLE stack takes up a lot of space.
;
[env:lissabon-kitchen-remote]
extends = lolin32
board_build.partitions = no_ota.csv
build_flags = ${common.build_flags} -DWITH_SECOND_DIMMER
