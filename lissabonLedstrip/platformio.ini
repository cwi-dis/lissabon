; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
    lissabon-5v-ledstrip
;    lissabon-12v-ledstrip
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of ../iotsa-board-defs.ini. Refresh the two toplevel iotsa-board-*.ini
; files whenever the iotsa dependency is bumped; do not hand-edit. App-specific
; choices stay in the [env:*] sections.
extra_configs =
    ../iotsa-board-traits.ini
    ../iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = 
#    symlink:///Users/jack/src/dis-git/iotsa
    https://github.com/cwi-dis/iotsa.git#develop
    libLissabon
    https://github.com/Makuna/NeoPixelBus#master
    https://github.com/jackjansen/NPBColorLib.git
    h2zero/NimBLE-Arduino
monitor_speed = 115200
; monitor_port = /dev/cu.SLAB_USBtoUART
; upload_port = /dev/cu.SLAB_USBtoUART
build_flags = -DIOTSA_WITH_BLE -DDIMMER_WITH_GAMMA -DDIMMER_WITH_ANIMATION -DDIMMER_WITH_TEMPERATURE -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
; Enable these to debug:
; build_type = debug
; monitor_filters = esp32_exception_decoder

; Local dev only (not in CI): minimodule JTAG debug on the pico32. Unfortunately
; the minimodule uses the same pins as the touchpads.
[pico32-debug]
extends = pico32
board_build.partitions = min_spiffs.csv
debug_tool = minimodule
upload_protocol = minimodule
build_flags = ${common.build_flags} -DCORE_DEBUG_LEVEL=5

;
; The lissabon ledstrips use an ESP32-PICO-KIT because it has enough pins, is
; cheap and Jack had a few available. No LiPo charger, but not needed for this
; project. min_spiffs -- the BLE stack needs the app space.
;
[env:lissabon-5v-ledstrip]
extends = pico32
board_build.partitions = min_spiffs.csv
; 5V RGBW chinese strips
build_flags = ${common.build_flags} -DIOTSA_NPB_FEATURE=NeoGrbwFeature -DIOTSA_NPB_POWER_PIN=27

[env:lissabon-12v-ledstrip]
extends = pico32
board_build.partitions = min_spiffs.csv
; 12V RGBW ENTTEC strips
build_flags = ${common.build_flags} -DIOTSA_NPB_FEATURE=NeoRgbwFeature -DIOTSA_NPB_POWER_PIN=27
